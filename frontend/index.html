<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AquaSense — Smart Water Consumption Analytics. Big Data pipeline, Spark analytics, anomaly detection and demand forecasting."
    />
    <title>AquaSense · Smart Water Analytics</title>
    <script>
      // Resolve the theme before first paint so a stored light preference
      // never flashes against the black default.
      (function () {
        try {
          if (localStorage.getItem("aqua-theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          /* private mode — keep the dark default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
